name: Build Windows Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build executable
        run: python build.py

      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackroomScheduler-windows
          path: dist/BackroomScheduler/

      - name: Create Release and attach zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path dist\BackroomScheduler\* -DestinationPath "BackroomScheduler-$tag-windows.zip"
          gh release create $tag "BackroomScheduler-$tag-windows.zip" `
            --title "OPD Backroom Scheduler $tag" `
            --notes "Windows build for $tag"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
